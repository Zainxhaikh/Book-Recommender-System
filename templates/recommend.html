<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommender System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: black;
            color: white;
        }
        .card {
            margin-bottom: 20px;
        }
        .card img {
            height: 250px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg" style="background-color: #00a65a;">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="/">My Book Recommender</a>
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link text-white" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="/recommend">Recommend</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Heading -->
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-white">Recommend Books</h1>
                <form action="/recommend_books" method="post">
                    <input type="text" class="form-control" name="user_input" placeholder="Enter book name, e.g. 1984"><br>
                    <input type="submit" class="btn btn-lg btn-warning" value="Recommend">
                </form>
            </div>
        </div>

        <!-- Books - Top 5 -->
        <div class="row">
            {% if data %}
                {% for i in data %}
                    <div class="col-md-3 mt-4">
                        <div class="card">
                            <img class="card-img-top" src="{{ i[2] }}" alt="book image">
                            <div class="card-body">
                                <h5>{{ i[0] }}</h5>
                                <p>Author - {{ i[1] }}</p>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            {% endif %}
        </div>
       
    </div>

</body>
</html>
