<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommender System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: black;
            color: white;
        }
        .card {
            margin-bottom: 20px;
        }
        .card img {
            height: 250px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg" style="background-color: #00a65a;">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="/">My Book Recommender</a>
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link text-white" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="/recommend">Recommend</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Heading -->
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-white">Top 50 Books</h1>
                <p class="text-white">These are the most popular books.</p>
            </div>
        </div>

        <!-- Books -->
        <div class="row">
            {% for i in range(book_name|length) %}
            <div class="col-md-3">
                <div class="card">
                    <img class="card-img-top" src="{{ image[i] }}" alt="book image">
                    <div class="card-body">
                        <h5>{{ book_name[i] }}</h5>
                        <p>Author - {{ author[i] }}</p>
                        <p>Votes - {{ votes[i] }}</p>
                        <p>Rating - {{ ratings[i] }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
